services:
  - type: web
    name: instagramai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.gptnix.online/v1
      - key: AI_MODEL
        value: zenith/gpt-5.2
      - key: CHECK_INTERVAL_SECONDS
        value: "30"
